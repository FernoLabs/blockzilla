[package]
name = "blockzilla-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Archive V2 and Replay V1 records, codecs, indexes, and registries for Blockzilla"
readme = "README.md"

[features]
default = ["known-program-logs"]
known-program-logs = [
    "blockzilla-program-logs/known-program-logs",
    "blockzilla-compact/known-program-logs",
    "blockzilla-archive-v2/known-program-logs",
]

[dependencies]
blockzilla-archive-v2 = { path = "../blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../blockzilla-compact", default-features = false }
blockzilla-live-format = { path = "../blockzilla-live-format" }
blockzilla-primitives = { path = "../blockzilla-primitives" }
blockzilla-program-logs = { path = "../blockzilla-program-logs", default-features = false }
blockzilla-registry = { path = "../blockzilla-registry" }
