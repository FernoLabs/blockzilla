[package]
name = "blockzilla-archive-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "High-level source facade for Blockzilla archive formats"

[dependencies]
blockzilla-firebase-indexer = { path = "../blockzilla-firebase-indexer" }
blockzilla-format = { version = "0.2.0", path = "../blockzilla-format" }
blockzilla-query-sdk = { version = "0.2.0", path = "../blockzilla-query-sdk" }
blockzilla-read-sdk = { version = "0.2.0", path = "../blockzilla-read-sdk", features = ["http"] }
of-car-reader = { path = "../old-faithful/car-reader", default-features = false, features = ["query-sdk-http"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
solana-epoch-schedule = "3.3.0"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"
