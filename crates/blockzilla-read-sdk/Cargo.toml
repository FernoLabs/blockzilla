[package]
name = "blockzilla-compact-v2-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, generation-verified Archive V2 streaming reader"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "assets/**"]
keywords = ["solana", "archive", "streaming", "indexer"]
categories = ["database", "filesystem"]

[features]
default = []
http = ["dep:blockzilla-source-http", "dep:blockzilla-source-cache", "dep:url"]

[dependencies]
url = { version = "2.5.8", optional = true }
blockzilla-source = { version = "0.2.0", path = "../source/blockzilla-source" }
blockzilla-source-local = { version = "0.2.0", path = "../source/blockzilla-source-local" }
blockzilla-source-http = { version = "0.2.0", path = "../source/blockzilla-source-http", optional = true }
blockzilla-source-cache = { version = "0.2.0", path = "../source/blockzilla-source-cache", optional = true }
anyhow = "1.0.100"
blockzilla-format = { version = "0.2.0", path = "../blockzilla-format" }
blockzilla-index-archive-format = { version = "0.2.0", path = "../blockzilla-index-archive-format" }
blockzilla-query-sdk = { version = "0.2.0", path = "../blockzilla-query-sdk" }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
smallvec = "1.15.1"
solana-signature = { version = "3.4.1", features = ["verify"] }
thiserror = "2.0.18"
wincode = { version = "=0.6.1", features = ["derive", "smallvec"] }
zstd = "0.13.3"

[dev-dependencies]
ed25519-dalek = "2.2.0"
tempfile = "3.24.0"

[[test]]
name = "compact_v2_public_api"
path = "tests/compact_v2_public_api.rs"
required-features = ["http"]
