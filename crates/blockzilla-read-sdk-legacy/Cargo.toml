[package]
name = "blockzilla-read-sdk-legacy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded, generation-verified Archive V2 streaming reader"
autobins = false

[features]
default = []
http = ["dep:reqwest", "dep:url"]

[dependencies]
blockzilla-format = { path = "../blockzilla-format" }
rayon = "1.11.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
smallvec = "1.15.2"
solana-pubkey = "4.2.0"
thiserror = "2.0.18"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.13.3"

[dependencies.reqwest]
version = "0.13.3"
optional = true
default-features = false
features = ["blocking", "rustls"]

[dependencies.url]
version = "2.5.8"
optional = true

[dev-dependencies]
tempfile = "3.24.0"

[[bin]]
name = "archive-v2-read-pattern-bench"
path = "src/bin/archive-v2-read-pattern-bench.rs"

[[bin]]
name = "archive-v2-wire-profile-scan"
path = "src/bin/archive-v2-wire-profile-scan.rs"
