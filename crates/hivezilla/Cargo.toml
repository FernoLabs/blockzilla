[package]
name = "blockzilla-hivezilla"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hive-style distributed planning and worker orchestration for Blockzilla CAR crunching"

[[bin]]
name = "hivezilla"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
blockzilla-format = { path = "../blockzilla-format", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
libc = "0.2.186"
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
