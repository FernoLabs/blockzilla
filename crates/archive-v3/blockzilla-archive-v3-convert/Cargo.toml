[package]
publish = ["crates-io"]
name = "blockzilla-archive-v3-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert an Archive V2 generation into canonical Archive V3"

autobins = false

[dependencies]
blockzilla-archive-v2 = { path = "../../compact-v2/blockzilla-archive-v2", default-features = false, version = "0.2.0" }
blockzilla-compact = { path = "../../compact-v2/blockzilla-compact", default-features = false, version = "0.2.0" }
blockzilla-primitives = { path = "../../blockzilla-primitives", default-features = false, version = "0.2.0" }
blockzilla-program-logs = { path = "../../parser/blockzilla-program-logs", default-features = false, version = "0.2.0" }
blockzilla-registry = { path = "../../compact-v2/blockzilla-registry", default-features = false, version = "0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
blockzilla-archive-v3 = { path = "../blockzilla-archive-v3", version = "0.2.0" }
blockzilla-archive-v3-reader = { path = "../blockzilla-archive-v3-reader", version = "0.2.0" }
blockzilla-compact-v2-reader = { path = "../../compact-v2/blockzilla-compact-v2-reader", version = "0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.14.0"
sha2 = "0.11.0"
solana-signature = { version = "3.4.1", features = ["verify"] }
solana-pubkey = "4.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "blockzilla-archive-v3-convert"
path = "src/main.rs"
