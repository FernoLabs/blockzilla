[package]
name = "blockzilla-read-sdk-legacy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded, generation-verified Archive V2 streaming reader"
autobins = false

[features]
default = []
http = ["dep:reqwest", "dep:url"]

[dependencies]
blockzilla-archive-v2 = { path = "../../compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../blockzilla-primitives", default-features = false }
blockzilla-program-logs = { path = "../../parser/blockzilla-program-logs", default-features = false }
blockzilla-registry = { path = "../../compact-v2/blockzilla-registry", default-features = false }
rayon = "1.12.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = "1.16.0"
solana-pubkey = "4.2.1"
thiserror = "2.0.20"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.14.0"

[dependencies.reqwest]
version = "0.13.4"
optional = true
default-features = false
features = ["blocking", "rustls"]

[dependencies.url]
version = "2.5.8"
optional = true

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "archive-v2-read-pattern-bench"
path = "src/bin/archive-v2-read-pattern-bench.rs"

[[bin]]
name = "archive-v2-wire-profile-scan"
path = "src/bin/archive-v2-wire-profile-scan.rs"

[lints]
workspace = true
