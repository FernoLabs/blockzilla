[package]
name = "blockzilla-reader-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
frame-profiler = ["pprof/frame-pointer"]

[dependencies]
anyhow = "1.0.102"
blockzilla-compact-v2-reader = { path = "../blockzilla-read-sdk", features = ["http"] }
blockzilla-indexer-v3-read-sdk = { path = "../blockzilla-indexer-v3-read-sdk" }
blockzilla-query-sdk = { path = "../blockzilla-query-sdk" }
blockzilla-example-workloads = { path = "../blockzilla-example-workloads" }
bs58 = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
pprof = { version = "0.15.0", features = ["flamegraph"] }
serde_json = "1.0.149"
