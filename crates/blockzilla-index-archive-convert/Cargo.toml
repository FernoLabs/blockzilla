[package]
name = "blockzilla-index-archive-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert an Archive V2 generation into Index Archive planes"

[dependencies]
anyhow = "1.0.104"
blockzilla-format = { path = "../blockzilla-format" }
blockzilla-index-archive-format = { path = "../blockzilla-index-archive-format" }
blockzilla-read-sdk = { path = "../blockzilla-read-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.13.3"
sha2 = "0.11.0"
solana-signature = { version = "3.4.1", features = ["verify"] }
solana-pubkey = "4.2.0"

[dev-dependencies]
tempfile = "3.24.0"
