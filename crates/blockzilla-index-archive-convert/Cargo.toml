[package]
name = "blockzilla-index-archive-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert an Archive V2 generation into Index Archive planes"

autobins = false

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-program-logs = { path = "../../crates/blockzilla-program-logs", default-features = false }
blockzilla-registry = { path = "../../crates/blockzilla-registry", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
blockzilla-index-archive-format = { path = "../blockzilla-index-archive-format" }
blockzilla-compact-v2-reader = { path = "../blockzilla-read-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.13.3"
sha2 = "0.11.0"
solana-signature = { version = "3.4.1", features = ["verify"] }
solana-pubkey = "4.2.0"

[dev-dependencies]
tempfile = "3.24.0"

[lints]
workspace = true

[[bin]]
name = "blockzilla-index-archive-convert"
path = "src/main.rs"

[[bin]]
name = "archive-v2-account-scan-bench"
path = "src/bin/archive-v2-account-scan-bench.rs"

[[bin]]
name = "ia-compare-prefix"
path = "src/bin/ia-compare-prefix.rs"

[[bin]]
name = "ia-read"
path = "src/bin/ia-read.rs"
