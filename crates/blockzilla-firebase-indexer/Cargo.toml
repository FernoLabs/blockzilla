[package]
name = "blockzilla-firebase-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Per-epoch reverse index: wallet pubkey -> program ids it interacted with (direct and CPI)"
default-run = "blockzilla-firebase-indexer"

[[bin]]
name = "blockzilla-firebase-indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
blockzilla-format = { path = "../blockzilla-format" }
blockzilla-read-sdk = { path = "../blockzilla-read-sdk" }
bs58 = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
pprof = { version = "0.15.0", features = ["flamegraph"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
smallvec = "1.15.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wincode = { version = "0.5.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24.0"
