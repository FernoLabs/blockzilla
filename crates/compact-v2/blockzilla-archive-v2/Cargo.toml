[package]
name = "blockzilla-archive-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
description = "Archive V2 container: layout, indexes and generation manifest"

[features]
default = ["known-program-logs"]
known-program-logs = [
    "blockzilla-program-logs/known-program-logs",
    "blockzilla-compact/known-program-logs",
    "known-drift",
]
# wire_rewrite gates test fixtures on this directly, so it must exist here too.
known-drift = ["blockzilla-program-logs/known-drift"]

[dependencies]
blockzilla-primitives = { path = "../../blockzilla-primitives" }
blockzilla-compact = { path = "../blockzilla-compact", default-features = false }
blockzilla-program-logs = { path = "../../parser/blockzilla-program-logs", default-features = false }
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
wincode = { version = "=0.6.1", features = ["derive"] }
of-car-reader = { path = "../../old-faithful/of-car-reader", version = "0.2.0", default-features = false }

[lints]
workspace = true
