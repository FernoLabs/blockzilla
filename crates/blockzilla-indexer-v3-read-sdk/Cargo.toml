[package]
name = "blockzilla-indexer-v3-read-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Source-neutral engine and targeted reader for Blockzilla Archive V3"
readme = "README.md"

[dependencies]
blockzilla-source = { version = "0.2.0", path = "../source/blockzilla-source" }
blockzilla-source-local = { version = "0.2.0", path = "../source/blockzilla-source-local" }
blockzilla-source-http = { version = "0.2.0", path = "../source/blockzilla-source-http" }
blockzilla-source-cache = { version = "0.2.0", path = "../source/blockzilla-source-cache" }
anyhow = "1.0.100"
blockzilla-archive-v2 = { path = "../blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../blockzilla-primitives", default-features = false }
blockzilla-registry = { path = "../blockzilla-registry", default-features = false }
blockzilla-index-archive-format = { path = "../blockzilla-index-archive-format" }
blockzilla-compact-v2-reader = { path = "../blockzilla-read-sdk", default-features = false }
blockzilla-user-program-index = { path = "../blockzilla-user-program-index" }
blockzilla-query-sdk = { version = "0.2.0", path = "../blockzilla-query-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.13.3"

[dev-dependencies]
ed25519-dalek = "2.2.0"
tempfile = "3.23.0"

[lints]
workspace = true
