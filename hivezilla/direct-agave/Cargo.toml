[package]
name = "hivezilla-direct-agave"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hivezilla-direct-agave"
path = "src/main.rs"

[features]
default = []
plugin = ["dep:agave-geyser-plugin-interface", "dep:solana-transaction", "dep:solana-message", "dep:solana-transaction-status", "dep:solana-transaction-error"]
bank-v2 = ["plugin"]

[dependencies]
anyhow = "1.0.104"
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = {version = "1.0.151", features = ["raw_value"]}
zstd = "0.13.3"
sha2 = "0.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
crossbeam-channel = "0.5.15"
libc = "0.2.189"
clap = { version = "4.6.6", features = ["derive"] }
five8 = "1.0.0"
wincode = { version = "=0.6.1", features = ["derive"] }
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
agave-geyser-plugin-interface = { git = "https://github.com/anza-xyz/agave", rev = "a203300045b405f86c9c84308b2eae76af69ac3b", features = ["agave-unstable-api"], optional = true }
solana-transaction-status = { git = "https://github.com/anza-xyz/agave", rev = "a203300045b405f86c9c84308b2eae76af69ac3b", features = ["agave-unstable-api"], optional = true }
solana-transaction = { version = "=4.2.0", features = ["wincode"], optional = true }
solana-transaction-error = { version = "=3.4.0", features = ["wincode"], optional = true }
solana-message = { version = "=4.5.0", features = ["wincode"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = "deny"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"
