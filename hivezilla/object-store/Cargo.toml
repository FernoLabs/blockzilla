[package]
name = "hivezilla-object-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral immutable object storage contract for Hivezilla"
publish = false
autobins = false

[[bin]]
name = "blockzilla-s3-upload"
path = "src/bin/blockzilla-s3-upload.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4.3"
libc = "0.2.189"
md5 = { package = "md-5", version = "0.11.0" }
quick-xml = "0.42.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.11.0"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
