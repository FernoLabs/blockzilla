[package]
name = "hivezilla-shred-hook"
version = "0.1.0"
edition.workspace = true
rust-version = "1.97"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hivezilla-shred-hook-recorder"
path = "src/bin/recorder.rs"
required-features = ["recorder"]

[features]
default = ["recorder"]
recorder = ["dep:hivezilla-protocol", "dep:anyhow", "dep:clap", "dep:libc", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
hivezilla-shred-hook-abi = { path = "../shred-hook-abi" }
hivezilla-protocol = { path = "../protocol", optional = true }
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
libc = { version = "0.2.189", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
