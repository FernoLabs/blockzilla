[package]
name = "hivezilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hivezilla"
path = "src/main.rs"

[[bin]]
name = "shred-reconstruct-trial"
path = "src/bin/shred-reconstruct-trial.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "shred-fec-gap-trial"
path = "src/bin/shred-fec-gap-trial.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "shred-epoch-audit"
path = "src/bin/shred-epoch-audit.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "repair-wal-inspect"
path = "src/bin/repair-wal-inspect.rs"
required-features = ["shred-reconstruction"]

[features]
default = []
shred-reconstruction = [
    "shred-reconstruction-backend-own",
    "dep:reed-solomon-erasure",
    "dep:solana-entry",
    "dep:solana-gossip",
    "dep:solana-hash",
    "dep:solana-keypair",
    "dep:solana-ledger-compat",
    "dep:solana-net-utils",
    "dep:solana-pubkey",
    "dep:solana-rpc-client",
    "dep:wincode",
]
shred-reconstruction-backend-own = ["dep:solana-ledger-compat"]

[package.metadata.cargo-machete]
# Referenced only by the tonic-generated code in OUT_DIR, which machete cannot see.
ignored = ["tonic-prost"]

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-live-format = { path = "../../crates/blockzilla-live-format", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
anyhow = "1.0.104"
ahash = "0.8.12"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
five8 = "1.0.0"
futures = "0.3.34"
gxhash = "3.5.0"
hashbrown = "0.17.1"
hivezilla-protocol = { path = "../protocol" }
libc = "0.2.189"
of-car-reader = { path = "../../crates/old-faithful/of-car-reader", version = "0.2.0", default-features = false }
lru = "0.18.4"
prost = "0.14.4"
reed-solomon-erasure = { version = "6.0.0", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rustc-hash = "2.1.3"
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
solana-shred-codec = { path = "../../crates/solana-codec/solana-shred-codec" }
solana-entry = { version = "=4.2.2", features = ["agave-unstable-api"], optional = true }
solana-gossip = { path = "../gossip-compat", optional = true }
# Agave 4.2.2 bounds its split SDK dependencies to the wincode 0.5 wire traits.
# Match that family here; our archive types use blockzilla-wincode 0.6 below.
solana-hash = { version = "=4.5.0", features = ["serde"], optional = true }
solana-keypair = { version = "=3.1.2", optional = true }
solana-net-utils = { version = "=4.2.2", features = ["agave-unstable-api"], optional = true }
solana-pubkey = { version = "=4.2.1", optional = true }
solana-rpc-client = { version = "=4.2.2", optional = true }
solana-ledger-compat = { path = "../ledger-compat", optional = true }
sha2 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
blockzilla-wincode = { package = "wincode", version = "=0.6.1" }
wincode = { version = "=0.5.5", features = ["derive"], optional = true }
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"
zstd = "0.14.0"
zeroize = "1.9.0"

[dev-dependencies]
solana-keypair = "=3.1.2"
tempfile = "3.27.0"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[lints]
workspace = true
