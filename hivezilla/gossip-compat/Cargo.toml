[package]
name = "solana-gossip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal local compatibility surface for shard of `solana-gossip` used by Blockzilla."
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# These value types implement the wincode 0.5 traits used by Agave 4.2.2.
# Their latest releases use wincode 0.6 and are outside Agave's dependency bounds.
solana-address = { version = "=2.6.1", features = ["serde", "wincode"] }
solana-hash = { version = "=4.5.0", features = ["serde", "wincode"] }
serde-big-array = "0.5.1"
solana-keypair = { version = "=3.1.2" }
solana-signature = { version = "=3.4.1", features = ["serde", "wincode"] }
solana-sha256-hasher = { version = "3.1.0" }
tracing = "0.1.44"
wincode = "=0.5.5"

[lints]
workspace = true
