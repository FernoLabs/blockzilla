[package]
name = "hivezilla-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Transport has no validator ABI or Solana runtime dependencies.
[workspace]

[dependencies]
anyhow = "1.0.104"
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2" }
async-stream = "0.3.6"
axum = "0.8.8"
bytes = "1.11"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
hivezilla-object-store = { path = "../object-store" }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2", "json"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
blockzilla-bank-stream-v2 = { path = "../../crates/blockzilla-bank-stream-v2", features=["test-fixtures"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
