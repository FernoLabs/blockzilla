[package]
name = "blockzilla-rust-stream-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "blockzilla-rust-stream-example"

[workspace]

[dependencies]
async-stream = "0.3.6"
anyhow = "1.0"
blockzilla-bank-stream-v2 = { path = "../../../../crates/blockzilla-bank-stream-v2" }
rusqlite = { version="=0.40.2", features=["bundled","fallible_uint"] }
blockzilla-stream-decoder = { path = "../../decoder" }
bytes = "1.11"
futures-util = "0.3"
hivezilla-stream = { path = "../.." }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
