[package]
name = "blockzilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
default-run = "blockzilla"

[features]
default = ["known-program-logs"]
known-program-logs = [
    "blockzilla-program-logs/known-program-logs",
    "blockzilla-compact/known-program-logs",
    "blockzilla-archive-v2/known-program-logs",
]
# Opt-in binaries for archive investigation and fixture extraction.
diagnostic-tools = []
# Opt-in experimental performance probes; these are not stable user commands.
benchmark-tools = []
# Opt-in one-time repair tools that do not use publication authority.
archive-repair-tools = []
# Opt-in one-shot archive migration programs.
migration-tools = [
    "dep:blockzilla-archive-gateway",
    "dep:blockzilla-token-transaction-dump",
]
# Convenience feature for contributors who need every non-product binary.
developer-tools = ["diagnostic-tools", "benchmark-tools", "migration-tools"]

# The supported product entry point. All other binaries below are contributor tools.
[[bin]]
name = "blockzilla"
path = "src/main.rs"

[[bin]]
name = "car-log-audit"
path = "src/bin/car_log_audit.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "compare-archive-v2-access"
path = "src/bin/compare_archive_v2_access.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "dump-system-instruction-slot"
path = "src/bin/dump_system_instruction_slot.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "dump-vote-instruction-slot"
path = "src/bin/dump_vote_instruction_slot.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "inspect-hot-tx-logs"
path = "src/bin/inspect_hot_tx_logs.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "verify-access-vote-hashes"
path = "src/bin/verify_access_vote_hashes.rs"
required-features = ["diagnostic-tools"]

[[bin]]
name = "big-block-log-bench"
path = "src/bin/big_block_log_bench.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "blockhash-scan-bench"
path = "src/bin/blockhash_scan_bench.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "first-seen-hot-tier-bench"
path = "src/bin/first_seen_hot_tier_bench.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "first-seen-registry-bench"
path = "src/bin/first_seen_registry_bench.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "upgrade-block-access-vote-hashes"
path = "src/bin/upgrade_block_access_vote_hashes.rs"
required-features = ["migration-tools"]

[[bin]]
name = "archive-v2-pre-to-post"
path = "src/bin/archive_v2_pre_to_post.rs"
required-features = ["migration-tools"]

[[bin]]
name = "archive-v2-normalize-metadata"
path = "src/bin/archive_v2_normalize_metadata.rs"
required-features = ["migration-tools"]

[[bin]]
name = "archive-v2-normalize-metadata-trusted"
path = "src/bin/archive_v2_normalize_metadata_trusted.rs"
required-features = ["archive-repair-tools"]

[[bin]]
name = "archive-v2-build-source-authority"
path = "src/bin/archive_v2_build_source_authority.rs"
required-features = ["migration-tools"]

[[bin]]
name = "archive-v2-publish-normalized-metadata"
path = "src/bin/archive_v2_publish_normalized_metadata.rs"
required-features = ["migration-tools"]

[[bin]]
name = "validate-ordered-registry"
path = "src/bin/validate_ordered_registry.rs"

[[bin]]
name = "validate-ordered-compact-observer"
path = "src/bin/validate_ordered_compact_observer.rs"

[dependencies]
blockzilla-archive-v3-convert = { path = "../../crates/archive-v3/blockzilla-archive-v3-convert" }
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-live-format = { path = "../../crates/blockzilla-live-format", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-program-logs = { path = "../../crates/parser/blockzilla-program-logs", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
# Historical VoteInstruction payloads use the fixed-width bincode 1 wire format.
bincode = "1.3.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
blockzilla-read-sdk = { package = "blockzilla-read-sdk-legacy", path = "../../crates/compat/blockzilla-read-sdk-legacy" }
blockzilla-archive-gateway = { path = "../archive-gateway", optional = true }
blockzilla-token-transaction-dump = { path = "../../indexer/blockzilla-token-transaction-dump", optional = true }
blockzilla-log-parser = { path = "../../crates/parser/blockzilla-log-parser" }
of-car-reader = { path = "../../crates/old-faithful/of-car-reader" }
zstd = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.23.1"
bs58 = "0.5.1"
postcard = "1.1.3"
data-encoding = "2.11.1"
solana-pubkey = "4.2.1"
# Agave 4.2.2 requires the split SDK family with wincode 0.5 traits.
solana-short-vec = { version = "=3.2.2", default-features = false }
solana-vote-interface = { version = "=6.0.3", features = ["serde"] }
wincode = { version = "=0.6.1", features = ["derive"] }
minicbor = { version = "2.3.0", features = ["full"] }
gxhash = "3.5.0"
hashbrown = "0.17.1"
libc = "0.2.189"
memmap2 = "0.9.11"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
] }
rayon = "1.12.0"
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
tempfile = "3.27.0"

[lints]
workspace = true
