[package]
name = "blockzilla-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

[dependencies]
# "datastar" pulls in the router's "sse" feature; "tower" supports the
# response-header layer used in main.rs. Stream capacity is enforced by a
# body-owned semaphore permit in api/stream.rs.
# Adjust feature names against `cargo doc` for your pinned topcoat version
# if they've shifted since 0.5.0. (No "tailwind" feature: CSS is a
# pre-compiled static asset, not built via topcoat's bundler -- see
# README.md and src/api/styles.rs.)
topcoat = { version = "0.7.0", features = ["datastar", "tower"] }

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-core = "0.3.34"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "rustls"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
anyhow = "1.0.104"
rand = "0.10.2"
rustix = { version = "1.1.4", features = ["fs"] }
libc = "0.2.189"
regex = "1.13.1"
tower-http = { version = "0.7.1", features = ["set-header"] }

[[bin]]
name = "blockzilla-monitor"
path = "src/main.rs"

[lints]
workspace = true
