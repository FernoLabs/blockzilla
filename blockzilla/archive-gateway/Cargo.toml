[package]
name = "blockzilla-archive-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Read-only HTTP range gateway for immutable Blockzilla Archive V2 generations"
autobins = false

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
blockzilla-read-sdk = { package = "blockzilla-read-sdk-legacy", path = "../../crates/compat/blockzilla-read-sdk-legacy" }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
hex = "0.4.3"
http = "1.5.0"
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.14.0"

[[bin]]
name = "blockzilla-archive-gateway"
path = "src/main.rs"

[lints]
workspace = true
