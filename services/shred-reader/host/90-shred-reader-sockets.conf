# The receiver asks for a 64 MiB SO_RCVBUF. Linux accounts receive buffers at
# twice the requested size, so allow the effective socket buffer to reach 128 MiB.
# Keep rmem_default unchanged: only explicitly tuned sockets need this headroom.
net.core.rmem_max = 134217728

# Match Agave's send-buffer ceiling for gossip and bounded repair traffic.
net.core.wmem_max = 134217728
