[package]
name = "blockzilla-watcher-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
libc = "0.2.186"
regex = "1.12.3"
reqwest = { version = "0.13.3", default-features = false, features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
