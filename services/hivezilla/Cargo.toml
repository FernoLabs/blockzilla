[package]
name = "hivezilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hivezilla"
path = "src/main.rs"

[[bin]]
name = "shred-epoch-audit"
path = "src/bin/shred-epoch-audit.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "repair-wal-inspect"
path = "src/bin/repair-wal-inspect.rs"
required-features = ["shred-reconstruction"]

[features]
default = []
shred-reconstruction = [
    "dep:reed-solomon-erasure",
    "dep:solana-entry",
    "dep:solana-ledger",
    "dep:solana-pubkey",
]

[dependencies]
anyhow = "1.0.102"
ahash = "0.8.12"
base64 = "0.22.1"
blockzilla-format = { path = "../../crates/blockzilla-format" }
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
five8 = "1.0.0"
futures = "0.3.32"
gxhash = "3.5.0"
hashbrown = "0.17.1"
libc = "0.2.186"
of-car-reader = { path = "../../crates/old-faithful/car-reader", default-features = false }
prost = "0.14.3"
reed-solomon-erasure = { version = "6.0.0", optional = true }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "json", "rustls"] }
rustc-hash = "2.1.2"
rustls = { version = "0.23.40", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
solana-entry = { version = "=4.1.2", optional = true }
solana-ledger = { version = "=4.1.2", features = ["agave-unstable-api"], optional = true }
solana-pubkey = { version = "4.2.0", optional = true }
sha2 = "0.11.0"
socket2 = "0.6"
tokio = { version = "1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wincode = "0.5.4"
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = "12.4.0"
zstd = "0.13.3"
zeroize = "1.9.0"

[dev-dependencies]
solana-keypair = "=3.1.2"
tempfile = "3.23"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
