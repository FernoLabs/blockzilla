[package]
name = "hivezilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hivezilla"
path = "src/main.rs"

[[bin]]
name = "shred-reconstruct-trial"
path = "src/bin/shred-reconstruct-trial.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "shred-fec-gap-trial"
path = "src/bin/shred-fec-gap-trial.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "shred-epoch-audit"
path = "src/bin/shred-epoch-audit.rs"
required-features = ["shred-reconstruction"]

[[bin]]
name = "repair-wal-inspect"
path = "src/bin/repair-wal-inspect.rs"
required-features = ["shred-reconstruction"]

[features]
default = []
shred-reconstruction = [
    "shred-reconstruction-backend-own",
    "dep:reed-solomon-erasure",
    "dep:solana-address",
    "dep:solana-entry",
    "dep:solana-gossip",
    "dep:solana-hash",
    "dep:solana-keypair",
    "dep:solana-ledger-compat",
    "dep:solana-net-utils",
    "dep:solana-pubkey",
    "dep:solana-rpc-client",
    "dep:solana-reward-info",
    "dep:solana-signature",
    "dep:solana-short-vec",
    "dep:wincode",
]
shred-reconstruction-backend-own = ["dep:solana-ledger-compat"]

[package.metadata.cargo-machete]
# Referenced only by the tonic-generated code in OUT_DIR, which machete cannot see.
ignored = ["tonic-prost"]

[dependencies]
anyhow = "1.0.102"
ahash = "0.8.12"
axum = "0.8"
base64 = "0.22.1"
blockzilla-format = { path = "../../crates/blockzilla-format" }
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
five8 = "1.0.0"
futures = "0.3.32"
gxhash = "3.5.0"
hashbrown = "0.17.1"
hivezilla-protocol = { path = "../../crates/hivezilla-protocol" }
libc = "0.2.186"
of-car-reader = { path = "../../crates/old-faithful/car-reader", version = "0.2.0", default-features = false }
lru = "0.16"
prost = "0.14.3"
reed-solomon-erasure = { version = "6.0.0", optional = true }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rustc-hash = "2.1.2"
rustls = { version = "0.23.40", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
blockzilla-shred-codec = { path = "../../crates/shred-codec" }
solana-entry = { version = "=4.1.2", features = ["agave-unstable-api"], optional = true }
solana-gossip = { path = "../../crates/solana-gossip-compat", optional = true }
# Agave 4.1.2 still uses wincode 0.5 for its repair and message wire types. Keep its
# split SDK value types on compatible releases; newer semver-compatible releases use wincode 0.6.
solana-address = { version = "=2.6.1", optional = true }
solana-hash = { version = "=4.4.0", features = ["serde"], optional = true }
solana-keypair = { version = "=3.1.2", optional = true }
solana-net-utils = { version = "=4.1.2", features = ["agave-unstable-api"], optional = true }
solana-pubkey = { version = "=4.2.0", optional = true }
solana-rpc-client = { version = "=4.1.2", optional = true }
solana-reward-info = { version = "=6.2.0", optional = true }
solana-signature = { version = "=3.4.1", optional = true }
solana-short-vec = { version = "=3.2.2", optional = true }
solana-ledger-compat = { path = "../../crates/solana-ledger-compat", optional = true }
sha2 = "0.11.0"
socket2 = "0.6"
tokio = { version = "1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
blockzilla-wincode = { package = "wincode", version = "=0.6.1" }
wincode = { version = "=0.5.5", features = ["derive"], optional = true }
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = "12.4.0"
zstd = "0.13.3"
zeroize = "1.9.0"

[dev-dependencies]
solana-keypair = "=3.1.2"
tempfile = "3.23"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
