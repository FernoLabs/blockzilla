# The integrated shred receiver requests a 64 MiB SO_RCVBUF. Linux accounts
# receive buffers at twice the requested size, so allow an effective 128 MiB
# buffer. Keep rmem_default unchanged so unrelated sockets do not inherit it.
net.core.rmem_max = 134217728

# Match the send-buffer ceiling used by gossip and bounded repair traffic.
net.core.wmem_max = 134217728
