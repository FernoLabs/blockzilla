[package]
name = "blockzilla-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# "datastar" pulls in the router's "sse" feature; "tower" lets a
# tower::limit layer cap concurrent /api/stream connections (see main.rs).
# Adjust feature names against `cargo doc` for your pinned topcoat version
# if they've shifted since 0.5.0. (No "tailwind" feature: CSS is a
# pre-compiled static asset, not built via topcoat's bundler -- see
# README.md and src/api/styles.rs.)
topcoat = { version = "0.5", features = ["datastar", "tower"] }

tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls"] }
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
rand = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["set-header"] }
# Reuses the gateway's already-audited path/credential redaction
# (public_json::sanitize_public_string) as a defense-in-depth second pass
# on the public tier, instead of re-implementing the same regexes here.
blockzilla-watcher-gateway = { path = "../blockzilla-watcher-gateway" }
