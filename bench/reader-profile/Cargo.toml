[package]
name = "blockzilla-reader-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "blockzilla-reader-profile"

[[bin]]
name = "car-decode-reference"
path = "src/bin/car-decode-reference.rs"
required-features = ["car-reference"]

[features]
frame-profiler = ["pprof/frame-pointer"]
car-reference = ["dep:of-car-reader", "dep:blake3", "dep:quick-protobuf"]
reference-mimalloc = ["car-reference", "dep:mimalloc"]

[dependencies]
of-car-reader = { path = "../../crates/old-faithful/of-car-reader", default-features = false, features = ["query-sdk-http", "zstd-native"], optional = true }
blake3 = { version = "1.8.7", optional = true }
quick-protobuf = { version = "0.8.1", optional = true }
mimalloc = { version = "0.1.52", optional = true }
anyhow = "1.0.104"
blockzilla-compact-v2-reader = { path = "../../crates/compact-v2/blockzilla-compact-v2-reader", features = ["http"] }
blockzilla-archive-v3-reader = { path = "../../crates/archive-v3/blockzilla-archive-v3-reader" }
blockzilla-model = { path = "../../crates/blockzilla-model" }
blockzilla-example-workloads = { path = "../../examples/workloads" }
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
pprof = { version = "0.15.0", features = ["flamegraph"] }
serde_json = "1.0.151"

[lints]
workspace = true
