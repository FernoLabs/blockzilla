[package]
name = "blockzilla-archive-v3-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "archive-v2-account-scan-bench"
path = "src/bin/archive-v2-account-scan-bench.rs"

[[bin]]
name = "ia-compare-prefix"
path = "src/bin/ia-compare-prefix.rs"

[dependencies]
blockzilla-archive-v3-convert = { path = "../../crates/archive-v3/blockzilla-archive-v3-convert" }
blockzilla-archive-v3-reader = { path = "../../crates/archive-v3/blockzilla-archive-v3-reader" }
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
anyhow = "1.0.104"
blockzilla-archive-v3 = { path = "../../crates/archive-v3/blockzilla-archive-v3" }
blockzilla-compact-v2-reader = { path = "../../crates/compact-v2/blockzilla-compact-v2-reader" }
of-car-reader = { path = "../../crates/old-faithful/of-car-reader", version = "0.2.0", default-features = false, features = ["zstd-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
wincode = "=0.6.1"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.24.0"

[lints]
workspace = true
