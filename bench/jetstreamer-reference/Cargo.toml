[package]
name = "jetstreamer-common-export-reference"
version = "0.1.0"
edition = "2021"
publish = false

# The reference is independent of the Blockzilla workspace and dependency graph.
[workspace]

[dependencies]
mimalloc = "=0.1.52"
jetstreamer-firehose = "=0.7.0"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
