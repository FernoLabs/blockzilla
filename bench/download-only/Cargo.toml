[package]
name = "blockzilla-download-only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "blockzilla-download-only"
path = "src/main.rs"
required-features = ["transport"]

[features]
# Keep HTTP/2 out of ordinary workspace builds of production readers.
transport = ["dep:reqwest"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking", "rustls", "http2"] }
serde_json = "1.0.151"

[lints]
workspace = true
