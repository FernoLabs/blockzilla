[package]
name = "blockzilla-archive-token-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "blockzilla-archive-token-events"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blockzilla-archive-sdk = { path = "../../crates/blockzilla-archive-sdk" }
blockzilla-dump = { path = "../../indexer/blockzilla-dump" }
blockzilla-model = { path = "../../crates/blockzilla-model" }
bs58 = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
