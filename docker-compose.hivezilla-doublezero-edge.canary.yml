services:
  hivezilla-doublezero-edge-canary:
    profiles: ["doublezero-edge-canary"]
    build:
      context: .
      dockerfile: services/hivezilla/Dockerfile.shred
    command:
      - record-shred-udp
      - --config
      - /etc/hivezilla/ingest.json
      - --source-id
      - doublezero-edge-leader
      - --journal-id
      - ${DOUBLEZERO_EDGE_JOURNAL_ID:?DOUBLEZERO_EDGE_JOURNAL_ID must be a stable 32-character hex value}
      - --status-file
      - /status/recorder.json
    network_mode: host
    restart: "no"
    stop_grace_period: 15s
    volumes:
      - ./services/hivezilla/config/ingest-doublezero-edge.example.json:/etc/hivezilla/ingest.json:ro
      - hivezilla-doublezero-edge-canary-data:/data
      - hivezilla-doublezero-edge-canary-status:/status
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hivezilla-doublezero-edge-canary-data:
  hivezilla-doublezero-edge-canary-status:
