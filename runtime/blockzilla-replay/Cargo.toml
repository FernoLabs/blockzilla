[package]
name = "blockzilla-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Replay-first Solana runtime experiments for Blockzilla"
autobins = false

[[bin]]
name = "blockzilla-replay-poc"
path = "src/main.rs"
required-features = ["genesis"]

[[bin]]
name = "extract-unsupported-program"
path = "src/bin/extract-unsupported-program.rs"

[features]
default = ["genesis"]
genesis = []

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
anyhow = "1.0.104"
base64 = "0.23.1"
blockzilla-read-sdk = { package = "blockzilla-read-sdk-legacy", path = "../../crates/compat/blockzilla-read-sdk-legacy" }
bzip2 = "0.6.1"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
curve25519-dalek = "=5.0.0"
hashbrown = "0.17.1"
object = { version = "0.40.0", default-features = false, features = ["elf", "read_core"] }
pprof = { version = "0.15.0", features = ["flamegraph"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = "1.16.0"
solana-sbpf = "=0.24.0"
target-lexicon = "=0.13.5"
tar = "0.4.46"
thiserror = "2.0.20"
wincode = { version = "=0.6.1", features = ["derive", "smallvec"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
cranelift-codegen = "=0.135.1"
cranelift-frontend = "=0.135.1"
cranelift-jit = "=0.135.1"
cranelift-module = "=0.135.1"
cranelift-native = "=0.135.1"

[[bin]]
name = "account-store-bench"
path = "src/bin/account-store-bench.rs"

[[bin]]
name = "bpf-execution-bench"
path = "src/bin/bpf-execution-bench.rs"

[[bin]]
name = "compact-account-trace"
path = "src/bin/compact-account-trace.rs"

[[bin]]
name = "compact-balance-audit"
path = "src/bin/compact-balance-audit.rs"

[[bin]]
name = "compact-conflict-bench"
path = "src/bin/compact-conflict-bench.rs"

[[bin]]
name = "compact-decode-bench"
path = "src/bin/compact-decode-bench.rs"

[[bin]]
name = "compact-native-audit"
path = "src/bin/compact-native-audit.rs"

[[bin]]
name = "compact-slot-balance-audit"
path = "src/bin/compact-slot-balance-audit.rs"

[[bin]]
name = "native-apply-bench"
path = "src/bin/native-apply-bench.rs"

[[bin]]
name = "recent-blockhashes-hotpath-bench"
path = "src/bin/recent-blockhashes-hotpath-bench.rs"

[[bin]]
name = "replay-hotpath-bench"
path = "src/bin/replay-hotpath-bench.rs"

[[bin]]
name = "replay-state-bench"
path = "src/bin/replay-state-bench.rs"

[lints]
workspace = true
