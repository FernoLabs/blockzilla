[workspace]
resolver = "2"
members = [
    "blockzilla",
    "crates/blockzilla-dex-parser",
    "crates/blockzilla-firebase-indexer",
    "crates/blockzilla-format",
    "crates/blockzilla-log-parser",
    "crates/blockzilla-read-sdk",
    "crates/blockzilla-replay",
    "crates/blockzilla-spyx-query",
    "crates/blockzilla-token-balance-audit",
    "crates/blockzilla-token-transaction-dump",
    "crates/hivezilla-object-store",
    "crates/hivezilla-protocol",
    "crates/old-faithful/car-reader",
    "crates/old-faithful/slot-ranges",
    "crates/shred-codec",
    "crates/solana-gossip-compat",
    "crates/solana-ledger-compat",
    "examples/token-api",
    "services/blockzilla-archive-gateway",
    "services/blockzilla-monitor",
    "services/hivezilla",
    "workers/blockzilla-get-block",
    "workers/old-faithful-get-block",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/FernoLabs/blockzilla"

# macOS otherwise keeps unpacked object files and full debug data for every
# changed crate hash. This workspace is large enough for those stale dev/test
# artifacts to consume tens of GiB in a few days. Debug assertions remain on;
# use the release-debug profile when full symbols are required.
[profile.dev]
debug = 0
split-debuginfo = "off"
incremental = false

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release-debug]
inherits = "release"
debug = true
strip = false

# clap's derive for blockzilla's large flat command tree produces a >2 MiB
# stack frame at opt-level 0, which overflows libtest's default worker stack.
# Keep this package's tests representative while compiling that generated
# builder down to a bounded frame; release settings are unchanged.
[profile.test.package.blockzilla]
opt-level = 1
