[workspace]
resolver = "2"
members = [
    "blockzilla",
    "crates/blockzilla-replay",
    "crates/solana-ledger-compat",
    "crates/hivezilla-object-store",
    "services/hivezilla",
    "crates/shred-codec",
    "crates/solana-gossip-compat",
    "services/blockzilla-archive-gateway",
    "services/blockzilla-monitor",
    "apps/blockzilla-get-block",
    "services/blockzilla-watcher-gateway",
    "apps/old-faithful-get-block",
    "crates/hivezilla-protocol",
    "crates/blockzilla-compaction-protocol",
    "crates/blockzilla-format",
    "crates/blockzilla-log-parser",
    "crates/blockzilla-read-sdk",
    "crates/old-faithful/car-reader",
    "crates/old-faithful/slot-ranges",
    "examples/token-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/FernoLabs/blockzilla"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release-debug]
inherits = "release"
debug = true
strip = false
