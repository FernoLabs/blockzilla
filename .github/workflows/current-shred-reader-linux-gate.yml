name: Current shred-reader Linux gate

on:
  push:
    branches:
      - codex/current-shred-reader-hardening-20260724
    paths:
      - .github/workflows/current-shred-reader-linux-gate.yml
      - .github/workflows/publish-current-shred-images.yml
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - docker-compose.hivezilla-shred.dokploy.yml
      - docker-compose.hivezilla-shred-pull-source.yml
      - docker-compose.hivezilla-shred-pull-source-gc-canary.yml
      - crates/blockzilla-format/**
      - crates/blockzilla-log-parser/**
      - crates/old-faithful/car-reader/**
      - services/blockzilla-watcher/**
      - services/hivezilla/**
      - services/shred-reader/**

permissions:
  contents: read

concurrency:
  group: current-shred-reader-linux-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shred-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate digest-only production compose
        shell: bash
        run: |
          set -euo pipefail
          compose=services/shred-reader/docker-compose.dokploy.yml
          if SHRED_FORWARD_ADDRS=127.0.0.1:18003 \
            docker compose --file "$compose" config --quiet 2>/dev/null; then
            echo "compose accepted a deployment without an immutable image digest" >&2
            exit 1
          fi
          digest="sha256:$(printf '0%.0s' {1..64})"
          image="$(
            SHRED_FORWARD_ADDRS=127.0.0.1:18003 \
            METRICS_ADDR=127.0.0.1:19190 \
            SHRED_READER_IMAGE_DIGEST="$digest" \
              docker compose --file "$compose" config --images
          )"
          test "$image" = "ghcr.io/fernolabs/blockzilla-shred-reader@$digest"
          healthcheck="$(
            SHRED_FORWARD_ADDRS=127.0.0.1:18003 \
            METRICS_ADDR=127.0.0.1:19190 \
            SHRED_READER_IMAGE_DIGEST="$digest" \
              docker compose --file "$compose" config \
              | sed -n '/healthcheck:/,/interval:/p'
          )"
          grep -F 'http://$${METRICS_ADDR}/readyz' <<<"$healthcheck"
          grep -F 'METRICS_ADDR: 127.0.0.1:19190' <(
            SHRED_FORWARD_ADDRS=127.0.0.1:18003 \
            METRICS_ADDR=127.0.0.1:19190 \
            SHRED_READER_IMAGE_DIGEST="$digest" \
              docker compose --file "$compose" config
          )

      - name: Reclaim runner disk for Agave build
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Test Bookworm receiver build
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --target test \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --file services/shred-reader/Dockerfile \
            .

      - name: Build and inspect local runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="shred-reader-ci:$GITHUB_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --target runtime \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            --file services/shred-reader/Dockerfile \
            .
          docker run --rm --entrypoint ldd "$image" /usr/local/bin/shred-reader \
            | tee "$RUNNER_TEMP/shred-reader-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/shred-reader-ldd.txt"; then
            exit 1
          fi
          revision="$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")"
          test "$revision" = "$GITHUB_SHA"

      - name: Smoke-test the actual receiver runtime and orderly stop
        shell: bash
        run: |
          set -euo pipefail
          image="shred-reader-ci:$GITHUB_SHA"
          container="shred-reader-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container" \
            --network none \
            --tmpfs /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700 \
            --env APP_ENV=production \
            --env SOLANA_ENTRYPOINTS=127.0.0.1:8001 \
            --env ADVERTISED_IP=1.1.1.1 \
            --env SHRED_VERSION=50093 \
            --env REQUIRE_REACHABILITY=false \
            --env SHRED_FORWARD_ADDRS=127.0.0.1:18003 \
            --env REPAIR_ENABLED=false \
            "$image"
          for _ in {1..60}; do
            if docker exec "$container" curl --fail --silent \
              http://127.0.0.1:19090/healthz >/dev/null 2>&1; then
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container" curl --fail --silent \
            http://127.0.0.1:19090/healthz >/dev/null
          test "$(docker exec "$container" id -u)" = 10001
          docker exec "$container" test -s /data/identity.json
          # No gossip peer or shred traffic is injected in this offline smoke test, so readiness
          # must fail closed even while process health is good.
          test "$(docker exec "$container" curl --silent --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:19090/readyz)" = 503
          timeout --signal=KILL 60s docker stop --time 59 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0

  hivezilla-recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify the explicit recorder CPU floor
        run: grep -qw aes /proc/cpuinfo

      - name: Validate immutable, project-isolated Hivezilla Compose
        shell: bash
        run: |
          set -euo pipefail
          compose=docker-compose.hivezilla-shred.dokploy.yml
          if SHRED_JOURNAL_ID=00000000000000000000000000000000 \
            docker compose --file "$compose" config --quiet 2>/dev/null; then
            echo "compose accepted a deployment without immutable application image digests" >&2
            exit 1
          fi
          digest="sha256:$(printf '0%.0s' {1..64})"
          rendered="$(
            COMPOSE_PROJECT_NAME=hivezilla-green \
            SHRED_JOURNAL_ID=00000000000000000000000000000000 \
            HIVEZILLA_SHRED_SOURCE_ID=shred-reader-green \
            HIVEZILLA_SHRED_IMAGE_DIGEST="$digest" \
            HIVEZILLA_SHRED_STATUS_IMAGE_DIGEST="$digest" \
            SHRED_STATUS_LISTEN_ADDR=127.0.0.1:18791 \
            SHRED_READER_METRICS_ADDR=127.0.0.1:19190 \
              docker compose --file "$compose" config
          )"
          rendered_json="$(
            COMPOSE_PROJECT_NAME=hivezilla-green \
            SHRED_JOURNAL_ID=00000000000000000000000000000000 \
            HIVEZILLA_SHRED_SOURCE_ID=shred-reader-green \
            HIVEZILLA_SHRED_IMAGE_DIGEST="$digest" \
            HIVEZILLA_SHRED_STATUS_IMAGE_DIGEST="$digest" \
            SHRED_STATUS_LISTEN_ADDR=127.0.0.1:18791 \
            SHRED_READER_METRICS_ADDR=127.0.0.1:19190 \
              docker compose --file "$compose" config --format json
          )"
          grep -F "ghcr.io/fernolabs/blockzilla-hivezilla-shred@$digest" <<<"$rendered"
          grep -F "ghcr.io/fernolabs/blockzilla-hivezilla-shred-status@$digest" <<<"$rendered"
          grep -F 'name: hivezilla-green' <<<"$rendered"
          grep -F 'hivezilla-green_hivezilla-shred-data' <<<"$rendered"
          validate_green_command() {
            jq -e '
              .services["hivezilla-shred"].command == [
                "record-shred-udp",
                "--config",
                "/etc/hivezilla/ingest.json",
                "--source-id",
                "shred-reader-green",
                "--journal-id",
                "00000000000000000000000000000000",
                "--status-file",
                "/status/recorder.json"
              ]
            ' >/dev/null
          }
          validate_green_command <<<"$rendered_json"
          if jq \
            '.services["hivezilla-shred"].command[4] = "shred-reader-green-evil"' \
            <<<"$rendered_json" | validate_green_command; then
            echo "exact green source-id assertion accepted a mutated source id" >&2
            exit 1
          fi
          grep -F '127.0.0.1:18791' <<<"$rendered"
          grep -F 'http://127.0.0.1:19190/metrics' <<<"$rendered"

      - name: Validate raw-shred pull examples remain non-deleting v2
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.gc == {"enabled": false}' \
            services/hivezilla/config/raw-shred-pull-source.example.json >/dev/null
          jq -e '.gc == {"enabled": true, "control_uid": 0, "recorder_gid": 10001, "max_retirements_per_process": 1}' \
            services/hivezilla/config/raw-shred-pull-source-gc-canary.example.json >/dev/null
          jq -e '.source.protocol == "v2"' \
            services/hivezilla/config/raw-shred-pull-client.example.json >/dev/null
          ingest=services/hivezilla/config/ingest-shred-udp.example.json
          validate_ingest_cutover_contract() {
            jq -e '
              [.sources[] | select(.enabled == true)] as $enabled
              | ($enabled | length) == 1
                and $enabled[0].id == "shred-reader-loopback"
                and $enabled[0].input.kind == "shred_udp"
                and $enabled[0].input.bind == "127.0.0.1:18003"
                and (
                  $enabled[0].input.durable_source_allowlist | sort_by(.name)
                ) == [
                  {"name": "blue", "address": "127.0.0.1:18004"},
                  {"name": "final", "address": "127.0.0.1:18204"},
                  {"name": "green", "address": "127.0.0.1:18104"}
                ]
            ' >/dev/null
          }
          validate_ingest_cutover_contract <"$ingest"
          if jq \
            '(.sources[0].input.durable_source_allowlist[]
              | select(.name == "final").address) = "127.0.0.1:18205"' \
            "$ingest" | validate_ingest_cutover_contract; then
            echo "cutover allowlist assertion accepted a mutated final address" >&2
            exit 1
          fi

      - name: Validate manual SHA-only image publisher contract
        shell: bash
        run: |
          set -euo pipefail
          publisher=.github/workflows/publish-current-shred-images.yml
          grep -F 'workflow_dispatch:' "$publisher"
          grep -F 'packages: write' "$publisher"
          grep -F 'published-image-digests.json' "$publisher"
          for repository in \
            ghcr.io/fernolabs/blockzilla-shred-reader \
            ghcr.io/fernolabs/blockzilla-hivezilla-shred \
            ghcr.io/fernolabs/blockzilla-hivezilla-shred-status; do
            grep -F "$repository" "$publisher"
          done
          if grep -Eq ':(edge|latest)([^[:alnum:]_-]|$)' "$publisher"; then
            echo "manual publisher contains a mutable edge/latest tag" >&2
            exit 1
          fi
          validate_publisher_actions() {
            local workflow="$1"
            local action_ref action revision
            local uses_count=0
            while IFS= read -r action_ref; do
              uses_count=$((uses_count + 1))
              action="${action_ref%@*}"
              revision="${action_ref##*@}"
              case "$action" in
                actions/checkout|actions/upload-artifact|\
                docker/setup-buildx-action|docker/login-action|docker/build-push-action)
                  ;;
                *)
                  echo "manual publisher uses an unapproved action: $action" >&2
                  return 1
                  ;;
              esac
              if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
                echo "manual publisher action is not pinned by a full commit SHA: $action_ref" >&2
                return 1
              fi
            done < <(
              sed -nE \
                's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p' \
                "$workflow"
            )
            if (( uses_count == 0 )); then
              echo "manual publisher contains no validated action references" >&2
              return 1
            fi
            local declared_count
            declared_count="$(
              grep -Ec '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*' "$workflow"
            )"
            if (( uses_count != declared_count )); then
              echo "manual publisher contains an action reference the validator could not parse" >&2
              return 1
            fi
          }
          validate_publisher_actions "$publisher"
          mutated_publisher="$RUNNER_TEMP/publisher-unpinned.yml"
          awk '
            !replaced && /uses:[[:space:]]+actions\/checkout@/ {
              sub(/@[0-9a-f]+/, "@latest")
              replaced = 1
            }
            { print }
            END {
              if (!replaced) {
                exit 1
              }
            }
          ' "$publisher" >"$mutated_publisher"
          if validate_publisher_actions "$mutated_publisher"; then
            echo "action validator accepted a mutable action reference" >&2
            exit 1
          fi

      - name: Validate the non-deleting pull-source sidecar
        shell: bash
        run: |
          set -euo pipefail
          compose=docker-compose.hivezilla-shred-pull-source.yml
          if docker compose --file "$compose" config --quiet 2>/dev/null; then
            echo "pull source accepted missing immutable image, volumes, or credentials" >&2
            exit 1
          fi
          digest="sha256:$(printf '0%.0s' {1..64})"
          rendered="$(
            HIVEZILLA_SHRED_IMAGE_DIGEST="$digest" \
            HIVEZILLA_SHRED_DATA_VOLUME=live-data \
            HIVEZILLA_SHRED_STATUS_VOLUME=live-status \
            HIVEZILLA_SHRED_CONTROL_VOLUME=live-control \
            HIVEZILLA_SHRED_PULL_CONFIG_PATH=./services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_SERVER_CERTIFICATE_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_SERVER_PRIVATE_KEY_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_CLIENT_CA_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_ALLOWED_NODES_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_RECEIPT_PUBLIC_KEY_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
              docker compose --file "$compose" config
          )"
          grep -F "ghcr.io/fernolabs/blockzilla-hivezilla-shred@$digest" <<<"$rendered"
          grep -F 'user: "0:0"' <<<"$rendered"
          grep -A2 -F 'group_add:' <<<"$rendered" | grep -F '10001'
          grep -F 'name: live-data' <<<"$rendered"
          grep -F 'name: live-status' <<<"$rendered"
          grep -F 'name: live-control' <<<"$rendered"
          grep -F 'DAC_READ_SEARCH' <<<"$rendered"
          data_mount="$(grep -A4 -F 'source: hivezilla-shred-data' <<<"$rendered")"
          grep -F 'read_only: true' <<<"$data_mount"

          canary="$(
            HIVEZILLA_SHRED_IMAGE_DIGEST="$digest" \
            HIVEZILLA_SHRED_DATA_VOLUME=live-data \
            HIVEZILLA_SHRED_STATUS_VOLUME=live-status \
            HIVEZILLA_SHRED_CONTROL_VOLUME=live-control \
            HIVEZILLA_SHRED_GC_CANARY_DATA_CLONE_VOLUME=clone-data \
            HIVEZILLA_SHRED_GC_CANARY_STATUS_CLONE_VOLUME=clone-status \
            HIVEZILLA_SHRED_GC_CANARY_CONTROL_CLONE_VOLUME=clone-control \
            HIVEZILLA_SHRED_PULL_CONFIG_PATH=./services/hivezilla/config/raw-shred-pull-source-gc-canary.example.json \
            HIVEZILLA_SHRED_PULL_SERVER_CERTIFICATE_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_SERVER_PRIVATE_KEY_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_CLIENT_CA_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_ALLOWED_NODES_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
            HIVEZILLA_SHRED_PULL_RECEIPT_PUBLIC_KEY_PATH=services/hivezilla/config/raw-shred-pull-source.example.json \
              docker compose --file "$compose" \
                --file docker-compose.hivezilla-shred-pull-source-gc-canary.yml config
          )"
          grep -F 'restart: "no"' <<<"$canary"
          grep -F 'name: clone-data' <<<"$canary"
          grep -F 'name: clone-status' <<<"$canary"
          grep -F 'name: clone-control' <<<"$canary"
          canary_data_mount="$(grep -A4 -F 'source: hivezilla-shred-data' <<<"$canary")"
          if grep -F 'read_only: true' <<<"$canary_data_mount"; then
            echo "GC canary data mount unexpectedly remained read-only" >&2
            exit 1
          fi

      - name: Reclaim runner disk for Hivezilla build
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Build and inspect the production Hivezilla recorder image
        shell: bash
        run: |
          set -euo pipefail
          image="hivezilla-shred-ci:$GITHUB_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --target runtime \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            --file services/hivezilla/Dockerfile.shred \
            .
          docker run --rm --entrypoint ldd "$image" /usr/local/bin/hivezilla \
            | tee "$RUNNER_TEMP/hivezilla-shred-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/hivezilla-shred-ldd.txt"; then
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/hivezilla "$image" --help \
            | grep -F 'serve-shred-spool-pull-source'
          docker run --rm --entrypoint /usr/local/bin/hivezilla "$image" \
            validate-ingest-config --config /etc/hivezilla/ingest.json >/dev/null
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          test "$(docker run --rm --entrypoint id "$image" -g)" = 10001

          data_volume="hivezilla-source-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control_volume="hivezilla-source-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_source_fixtures() {
            docker volume rm --force "$data_volume" "$control_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_source_fixtures EXIT
          docker volume create "$data_volume" >/dev/null
          docker volume create "$control_volume" >/dev/null
          docker run --rm --user 0:0 \
            --volume "$data_volume:/fixture" \
            --entrypoint /bin/sh "$image" -c \
            'umask 077; printf spool-fixture > /fixture/segment.wal; chown 10001:10001 /fixture/segment.wal; chmod 0600 /fixture/segment.wal'
          if docker run --rm --user 0:0 --group-add 10001 --cap-drop ALL \
            --volume "$data_volume:/fixture:ro" \
            --entrypoint /bin/sh "$image" -c 'grep -qx spool-fixture /fixture/segment.wal'; then
            echo "capability-free source unexpectedly read recorder-owned mode-0600 data" >&2
            exit 1
          fi
          docker run --rm --user 0:0 --group-add 10001 --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            --volume "$data_volume:/fixture:ro" \
            --entrypoint /bin/sh "$image" -c 'grep -qx spool-fixture /fixture/segment.wal'

          docker run --rm --user 0:0 \
            --volume "$control_volume:/control" \
            --entrypoint /bin/sh "$image" -c \
            'umask 077; printf wrong-owner > /control/wrong.wal; chown 10001:10001 /control/wrong.wal; printf root-owner > /control/good.wal; chmod 0600 /control/*.wal'
          if docker run --rm --user 0:0 --group-add 10001 --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            --volume "$control_volume:/control" \
            --entrypoint /bin/sh "$image" -c 'printf x >> /control/wrong.wal'; then
            echo "source unexpectedly wrote a recorder-owned mode-0600 ACK WAL" >&2
            exit 1
          fi
          docker run --rm --user 0:0 --group-add 10001 --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            --volume "$control_volume:/control" \
            --entrypoint /bin/sh "$image" -c \
            'printf x >> /control/good.wal; umask 077; : > /control/new.tmp; test "$(stat -c %u:%g /control/new.tmp)" = 0:0'
          cleanup_source_fixtures
          trap - EXIT
          revision="$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")"
          test "$revision" = "$GITHUB_SHA"

      - name: Build and inspect the immutable status collector image
        shell: bash
        run: |
          set -euo pipefail
          image="hivezilla-shred-status-ci:$GITHUB_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            --file services/hivezilla/Dockerfile.shred-status \
            .
          docker run --rm --entrypoint python3 "$image" \
            /app/shred_status_server.py --help >/dev/null
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          revision="$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")"
          test "$revision" = "$GITHUB_SHA"

  reconstruction-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Reclaim runner disk for reconstruction build
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Test Bookworm reconstruction build
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --target test \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --file services/hivezilla/Dockerfile.shred-audit \
            .

      - name: Build and inspect local reconstruction image
        shell: bash
        run: |
          set -euo pipefail
          image="shred-audit-ci:$GITHUB_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --target runtime \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            --file services/hivezilla/Dockerfile.shred-audit \
            .
          for binary in shred-epoch-audit repair-wal-inspect; do
            docker run --rm --entrypoint ldd "$image" "/usr/local/bin/$binary" \
              | tee "$RUNNER_TEMP/$binary-ldd.txt"
            if grep -q 'not found' "$RUNNER_TEMP/$binary-ldd.txt"; then
              exit 1
            fi
            docker run --rm --entrypoint "/usr/local/bin/$binary" "$image" --help \
              >/dev/null
          done
          revision="$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$image")"
          test "$revision" = "$GITHUB_SHA"

      - name: Test public status contract
        run: python3 services/hivezilla/scripts/test_shred_status_server.py

  watcher-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/blockzilla-watcher/package-lock.json

      - name: Install watcher dependencies
        working-directory: services/blockzilla-watcher
        run: npm ci

      - name: Test watcher status handling
        working-directory: services/blockzilla-watcher
        run: npm test

      - name: Check watcher UI
        working-directory: services/blockzilla-watcher
        run: npm run check

      - name: Build watcher UI
        working-directory: services/blockzilla-watcher
        run: npm run build
