[package]
name = "blockzilla-firebase-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Per-epoch reverse index: wallet pubkey -> program ids it interacted with (direct and CPI)"
default-run = "blockzilla-firebase-indexer"

autobins = false

[[bin]]
name = "blockzilla-firebase-indexer"
path = "src/main.rs"

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-program-logs = { path = "../../crates/parser/blockzilla-program-logs", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2.183"
blockzilla-read-sdk-legacy = { path = "../../crates/compat/blockzilla-read-sdk-legacy" }
anyhow = "1.0.102"
blockzilla-archive-v3 = { path = "../../crates/archive-v3/blockzilla-archive-v3" }
blockzilla-archive-v3-reader = { path = "../../crates/archive-v3/blockzilla-archive-v3-reader" }
blockzilla-model = { path = "../../crates/blockzilla-model" }
blockzilla-compact-v2-reader = { path = "../../crates/compact-v2/blockzilla-compact-v2-reader", features = ["http"] }
blockzilla-user-program-index = { version = "0.2.0", path = "../blockzilla-user-program-index" }
of-car-reader = { path = "../../crates/old-faithful/of-car-reader", default-features = false, features = ["zstd-native"] }
bs58 = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
pprof = { version = "0.15.0", features = ["flamegraph"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
smallvec = "1.15.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wincode = { version = "=0.6.1", features = ["derive"] }
zstd = "0.13.3"

[dev-dependencies]
ed25519-dalek = "2.2.0"
tempfile = "3.24.0"

[[bin]]
name = "archive-v2-account-projection-verify"
path = "src/bin/archive-v2-account-projection-verify.rs"

[[bin]]
name = "archive-v2-account-projection"
path = "src/bin/archive-v2-account-projection.rs"

[[bin]]
name = "archive-v2-lean-read-bench"
path = "src/bin/archive-v2-lean-read-bench.rs"

[[bin]]
name = "firewatch-wire-profile-audit-batch"
path = "src/bin/firewatch-wire-profile-audit-batch.rs"

[[bin]]
name = "firewatch-wire-profile-audit"
path = "src/bin/firewatch-wire-profile-audit.rs"

[[bin]]
name = "firewatch-wire-profile-marker-transition"
path = "src/bin/firewatch-wire-profile-marker-transition.rs"

[[bin]]
name = "index-bench"
path = "src/bin/index-bench.rs"

[[bin]]
name = "index-parity"
path = "src/bin/index-parity.rs"

[lints]
workspace = true
