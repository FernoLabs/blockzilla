[package]
name = "blockzilla-delegation-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Find historical SPL Token approvals to the deBridge State PDA"

[workspace]

[dependencies]
anyhow = "1.0.104"
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-compact-v2-reader = { path = "../../crates/compact-v2/blockzilla-compact-v2-reader", default-features = false }
blockzilla-dump = { path = "../blockzilla-dump" }
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[dev-dependencies]
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
tempfile = "3.27.0"
wincode = { version = "=0.6.1", features = ["derive"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
