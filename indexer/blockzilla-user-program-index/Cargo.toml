[package]
name = "blockzilla-user-program-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-epoch index from Solana signer users to reached programs"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "examples/**"]
keywords = ["solana", "archive", "index"]
categories = ["database", "data-structures"]
default-run = "blockzilla-user-program-index"
autobins = false

[features]
default = []
cli = ["dep:clap", "dep:tracing-subscriber"]
developer-tools = [
    "cli",
    "dep:blockzilla-read-sdk-legacy",
    "dep:libc",
    "dep:pprof",
    "dep:reqwest",
    "dep:zstd",
]

[[bin]]
name = "blockzilla-user-program-index"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
blockzilla-archive-v2 = { path = "../../crates/compact-v2/blockzilla-archive-v2", default-features = false }
blockzilla-primitives = { path = "../../crates/blockzilla-primitives", default-features = false }
blockzilla-registry = { path = "../../crates/compact-v2/blockzilla-registry", default-features = false }
anyhow = "1.0.104"
blockzilla-compact-v2-reader = { version = "0.2.0", path = "../../crates/compact-v2/blockzilla-compact-v2-reader" }
bs58 = "0.5.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = "1.16.0"
thiserror = "2.0.20"
tracing = "0.1.44"

# Optional operations and benchmarks. These do not enter the default library graph.
blockzilla-read-sdk-legacy = { path = "../../crates/compat/blockzilla-read-sdk-legacy", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
libc = { version = "0.2.189", optional = true }
pprof = { version = "0.15.0", features = ["flamegraph"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
zstd = { version = "0.14.0", optional = true }

[dev-dependencies]
blockzilla-compact = { path = "../../crates/compact-v2/blockzilla-compact", default-features = false }
wincode = { version = "=0.6.1", features = ["derive"] }
tempfile = "3.27.0"

[[bin]]
name = "archive-v2-account-projection-verify"
path = "src/bin/archive-v2-account-projection-verify.rs"
required-features = ["developer-tools"]

[[bin]]
name = "archive-v2-account-projection"
path = "src/bin/archive-v2-account-projection.rs"
required-features = ["developer-tools"]

[[bin]]
name = "archive-v2-lean-read-bench"
path = "src/bin/archive-v2-lean-read-bench.rs"
required-features = ["developer-tools"]

[[bin]]
name = "firewatch-wire-profile-audit-batch"
path = "src/bin/firewatch-wire-profile-audit-batch.rs"
required-features = ["developer-tools"]

[[bin]]
name = "firewatch-wire-profile-audit"
path = "src/bin/firewatch-wire-profile-audit.rs"
required-features = ["developer-tools"]

[[bin]]
name = "firewatch-wire-profile-marker-transition"
path = "src/bin/firewatch-wire-profile-marker-transition.rs"
required-features = ["developer-tools"]

[[bin]]
name = "index-bench"
path = "src/bin/index-bench.rs"
required-features = ["developer-tools"]

[[bin]]
name = "index-parity"
path = "src/bin/index-parity.rs"
required-features = ["developer-tools"]

[lints]
workspace = true
