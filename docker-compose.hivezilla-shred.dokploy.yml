services:
  hivezilla-shred:
    build:
      context: .
      dockerfile: services/hivezilla/Dockerfile.shred
    command:
      - record-shred-udp
      - --config
      - /etc/hivezilla/ingest.json
      - --source-id
      - shred-reader-loopback
      - --journal-id
      - ${SHRED_JOURNAL_ID:?SHRED_JOURNAL_ID must be a stable 32-character hex value}
      - --status-file
      - /status/recorder.json
    network_mode: host
    # Disk admission remains fail-closed. Retry so ACK-driven retention can release a sealed
    # segment and let this same journal resume without requiring an operator restart.
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - hivezilla-shred-data:/data
      - hivezilla-shred-status:/status
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The NAS initiates an mTLS pull from this listener. A verified durable NAS ACK advances replay
  # and permits bounded oldest-first retirement of sealed ACK-covered source segments.
  hivezilla-shred-pull:
    build:
      context: .
      dockerfile: services/hivezilla/Dockerfile.shred
    entrypoint: ["/usr/local/bin/run-raw-shred-pull-source"]
    # Dokploy bind-mounts the host trust directory with root-owned 0600 private keys. This
    # container keeps every capability dropped and only needs uid 0 to read those mounted files.
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    depends_on:
      - hivezilla-shred
    environment:
      SHRED_JOURNAL_ID: ${SHRED_JOURNAL_ID:?SHRED_JOURNAL_ID must be a stable 32-character lowercase hex value}
    volumes:
      - hivezilla-shred-data:/data
      - hivezilla-shred-status:/status:ro
      - hivezilla-shred-control:/control
      # Kept outside the Git checkout so Dokploy source refreshes cannot remove trust material.
      # Names match the strict runtime config and the directory is owned by the unprivileged UID.
      - /etc/blockzilla/hivezilla-shred-pull/secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  shred-ack-alert:
    build:
      context: .
      dockerfile: services/hivezilla/Dockerfile.shred-status
    entrypoint: ["python3", "/app/pull_ack_telegram_monitor.py"]
    restart: unless-stopped
    depends_on:
      - hivezilla-shred-pull
    environment:
      BLOCKZILLA_PULL_ACK_STATUS_FILE: /control/nas-shred-ack-status.json
      BLOCKZILLA_PULL_ACK_ALERT_STATE_FILE: /alert-state/shred-ack-alert.json
      BLOCKZILLA_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      BLOCKZILLA_TELEGRAM_CHAT_ID: ${BLOCKZILLA_TELEGRAM_CHAT_ID:?set the Telegram destination chat ID}
      BLOCKZILLA_PULL_ACK_STALE_AFTER_SECS: ${BLOCKZILLA_PULL_ACK_STALE_AFTER_SECS:-180}
      BLOCKZILLA_PULL_ACK_STARTUP_GRACE_SECS: ${BLOCKZILLA_PULL_ACK_STARTUP_GRACE_SECS:-120}
      BLOCKZILLA_PULL_ACK_MONITOR_INTERVAL_SECS: ${BLOCKZILLA_PULL_ACK_MONITOR_INTERVAL_SECS:-15}
    volumes:
      - hivezilla-shred-control:/control:ro
      - hivezilla-shred-alert-state:/alert-state
      - ${BLOCKZILLA_TELEGRAM_BOT_TOKEN_HOST_FILE:?set the host Telegram token file}:/run/secrets/telegram_bot_token:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  shred-status-collector:
    build:
      context: .
      dockerfile: services/hivezilla/Dockerfile.shred-status
    command:
      - --listen
      - 127.0.0.1:18790
      - --hivezilla-status-file
      - /recorder-status/recorder.json
      - --receiver-metrics-url
      - http://127.0.0.1:19090/metrics
      - --output-file
      - /public-status/public.json
      - --cors-origin
      - https://watcher.blockzilla.dev
    network_mode: host
    restart: unless-stopped
    depends_on:
      - hivezilla-shred
    volumes:
      - hivezilla-shred-status:/recorder-status:ro
      - hivezilla-shred-public-status:/public-status
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  shred-status-api:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    depends_on:
      - shred-status-collector
    expose:
      - "8080"
    volumes:
      - hivezilla-shred-public-status:/status:ro
      - ./services/hivezilla/config/shred-status-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hivezilla-shred-data:
  hivezilla-shred-status:
  hivezilla-shred-public-status:
  hivezilla-shred-control:
  hivezilla-shred-alert-state:
